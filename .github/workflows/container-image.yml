name: Container image

# Keeps ghcr.io/tonyp7/ps3dec:latest current with main. Release tags never
# rebuild the image themselves — release.yml promotes whatever this workflow
# already pushed for that commit (see add-release-automation's design.md).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tonyp7/ps3dec:latest
